name: update release draft

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-draft-main
  cancel-in-progress: true

jobs:
  update:
    if: (github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml
          commitish: main
