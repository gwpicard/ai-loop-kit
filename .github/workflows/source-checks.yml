# This workflow checks the kit's own source. It is named apart from checks.yml
# on purpose: that name belongs to the project check a founded project receives
# from the setup skill's foundation template, and once the source and the
# released kit share one repository the two would otherwise want the same path.
name: source checks
on:
  pull_request:
permissions:
  contents: read

# A second push to the same pull request replaces the first. Without this,
# the run it replaced keeps going and is still billed.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-kit-validation:
    if: github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate adapters and check for drift
        run: .agents/tools/build-adapters.sh --check
      - name: Validate the kit
        run: .agents/tools/validate-kit.sh
  # Every rehearsal in .agents/tests/ runs here, in one job. A job for each of
  # them names a failure on the checks list, but a hosted job is billed a whole
  # minute however long it takes, and most of these finish in seconds. Twenty
  # five of them cost twenty five minutes to do about three minutes of work.
  # The runner names every failure instead, in its output and in the run
  # summary, and it reads the folder rather than a list, so a rehearsal cannot
  # be added without being run.
  #
  # The replay harness stays out: it costs money and needs a model, which its
  # own README explains.
  rehearsal:
    if: github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit'
    runs-on: ubuntu-latest
    # A rehearsal that waits for an answer nobody is there to give should stop
    # rather than hold the queue open.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Rehearse
        run: .agents/tests/run-all.sh
