name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to prepare, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm the release version is new
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Published versions must be stable and look like v0.1.0."
            exit 1
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "$VERSION already has a tag, so it cannot be prepared again."
              exit 1
              ;;
            2) ;;
            *)
              echo "The existing release tags could not be checked."
              exit 1
              ;;
          esac
      - name: Validate the source
        run: .agents/tools/validate-kit.sh
      - name: Confirm main carries this version
        # Both installers read this branch, so the version it carries is the
        # version every new installation reports. Stamping is a reviewed change
        # like any other, and it has to be merged before the release is cut.
        run: .agents/tools/stamp-version.sh --check "$VERSION"
      - name: Assemble the starter
        run: .agents/tools/build-release.sh "$VERSION" "$RUNNER_TEMP/starter"
      - name: Package the starter
        run: tar -czf "$RUNNER_TEMP/ai-build-kit-$VERSION.tar.gz" -C "$RUNNER_TEMP/starter" .
      - name: Finish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(git rev-parse HEAD)
          .agents/tools/finish-release-draft.sh \
            "$VERSION" \
            "$RUNNER_TEMP/ai-build-kit-$VERSION.tar.gz" \
            "$target"
