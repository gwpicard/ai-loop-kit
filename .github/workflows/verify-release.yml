name: verify release

# What was published is rebuilt from its own tag and compared with the archive
# that was reviewed before publication. It cannot un-publish anything, and it is
# not meant to: it turns a draft retargeted by hand, or a merge that landed
# between preparation and publication, into a red mark instead of a silent
# divergence.
#
# There is one repository now, so a release is published where it was prepared
# and nothing has to be copied anywhere.
#
# Verification itself writes nothing, and the job that does it reads as it
# always has. One job beside it writes, and only to move `stable` to the
# release that has just been verified, so the branch the world installs from
# carries a published release rather than whatever has merged since. That job
# runs after verification and never instead of it, so a release that fails
# verification leaves `stable` where it was. What bounds the write is in
# .agents/tools/promote-stable.sh, beside the code that makes it.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release-ref.outputs.commit }}
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: current-main
      - name: Confirm the released tag belongs to main
        id: release-ref
        working-directory: current-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Only stable versions such as v0.1.0 are published."
            exit 1
          fi
          # Ask for the tag's commit instead of fetching the tag. The checkout
          # above keeps no credential, deliberately. This call carries the run's
          # own token, and main is already present in full, so the check below
          # stays local.
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq '.sha') || \
            tag_commit=""
          if [ -z "$tag_commit" ]; then
            echo "$VERSION has no commit on this repository yet; publish again once the tag exists."
            exit 1
          fi
          if ! git cat-file -e "$tag_commit^{commit}" 2>/dev/null; then
            echo "$VERSION points at work that is not in this repository's history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo "$VERSION does not point to reviewed main-branch work."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-ref.outputs.commit }}
          persist-credentials: false
          path: released-source
      - name: Validate the released source
        working-directory: released-source
        run: .agents/tools/validate-kit.sh
      - name: Assemble the starter
        working-directory: released-source
        run: .agents/tools/build-release.sh "$VERSION" "$RUNNER_TEMP/starter"
      - name: Compare with the reviewed starter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prepared-archive" "$RUNNER_TEMP/prepared-starter"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ai-build-kit-$VERSION.tar.gz" \
            --dir "$RUNNER_TEMP/prepared-archive"
          tar -xzf "$RUNNER_TEMP/prepared-archive/ai-build-kit-$VERSION.tar.gz" \
            -C "$RUNNER_TEMP/prepared-starter"
          diff -qr "$RUNNER_TEMP/starter" "$RUNNER_TEMP/prepared-starter"

  # The branch every installer reads is moved here, and nowhere else.
  #
  # `needs: verify` is the gate. A release whose rebuild does not match the
  # reviewed archive fails the job above, this one never starts, and `stable`
  # stays on the previous release.
  #
  # The permission block belongs to this job alone. A block written at the top
  # of the file would hand the same power to verification, which needs to read
  # and nothing more.
  promote-stable:
    if: github.repository == 'gwpicard/ai-build-kit' || github.repository == 'gwpicard/ai-loop-kit'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The verified commit, not current main. The tag, the tool and the tree
      # being promoted then all come from the same reviewed commit, and a
      # release published while a later pull request sits on main cannot be
      # moved by that pull request's version of this tool.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Point stable at the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: .agents/tools/promote-stable.sh "$VERSION" "$COMMIT"
