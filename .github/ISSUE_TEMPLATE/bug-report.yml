name: Report a problem
description: Tell us when AI Loop Kit does not behave as described.
title: "[Problem] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, personal data or private project details.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone reproduce it?
      description: Give the shortest steps that show the problem.
    validations:
      required: true
