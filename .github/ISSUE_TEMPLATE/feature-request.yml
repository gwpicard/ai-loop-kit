name: Suggest an idea
description: Describe something AI Loop Kit should help a person do.
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: situation
    attributes:
      label: When would you use this?
      description: Describe the situation and the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What should the person see or do?
      description: Describe the result in plain words. You do not need a technical design.
    validations:
      required: true
