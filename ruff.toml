# The v1 lint rules. Python 3.10 or later, standard library only.
# tests/lint.sh applies this set to every Python file except the borrowed files
# that no v1 piece has adapted yet. Those keep E4,E7,E9,F (see BORROWED.md).
target-version = "py310"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PLW1510", "S602", "S604", "S605"]
