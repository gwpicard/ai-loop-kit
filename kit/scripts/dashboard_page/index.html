<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="loop-token" content="{{token}}">
<title>Run view</title>
<link rel="stylesheet" href="/app.css">
</head><body>
<header><h1>Run view</h1><p id="run">Loading</p></header>
<div id="notices"></div>
<div id="start"><label><input type="checkbox" id="keep-going"> Keep going until nothing is ready</label>
<button id="run-button" type="button" disabled>Run ticked pieces</button>
<div id="answer" role="status"></div></div>
<main id="lanes">
<section data-lane="to-shape"><h2>To shape</h2><ul></ul></section>
<section data-lane="shaped"><h2>Shaped</h2><ul></ul></section>
<section data-lane="in-run"><h2>In the run</h2><ul></ul></section>
<section data-lane="landed"><h2>Landed</h2><ul></ul></section>
</main>
<p id="connection" role="status"></p>
<script src="/app.js"></script>
</body></html>
