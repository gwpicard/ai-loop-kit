name: A piece of work
description: One small, visible change. It files into shaping, and the agent shapes it until the ready gate accepts it.
title: "<what the person will be able to do>"
body:
  - type: markdown
    attributes:
      value: |
        Write the idea in your own words. The title says what you will be able
        to do. You do not need to fill in a spec: `/shape` asks what it needs
        and writes the spec block for you. This piece files into shaping. Only
        the gate moves it on, and it never moves a piece to ready until its
        needs list is empty.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want, in your own words. Keep your wording. It is quoted as it is.
      placeholder: Let people export their invoices as a CSV file.
    validations:
      required: true

  - type: textarea
    id: so-that
    attributes:
      label: So that
      description: The one outcome this exists for, in one line.
      placeholder: Freelancers can send their invoices to an accountant.
    validations:
      required: false

  - type: textarea
    id: know-already
    attributes:
      label: What you already know
      description: >
        Limits, examples, a page or a file that shows what you mean, and anything
        the piece must leave alone. A guess is welcome if you say it is a guess.
      placeholder: It must not change how invoices are stored.
    validations:
      required: false

  - type: textarea
    id: sensitive
    attributes:
      label: Does it touch money, personal data or sign-in
      description: >
        Say yes, no or not sure. A yes means the gate asks for your written
        acceptance before the piece can be ready.
      placeholder: Not sure. It shows customer names.
    validations:
      required: false
