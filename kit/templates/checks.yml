name: checks
on:
  pull_request:
jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The kit is not part of the project, so the runner fetches it. Founding
      # replaces {{KIT_REF}} with the kit version that founded the project.
      - uses: actions/checkout@v6
        with:
          repository: gwpicard/ai-loop-kit
          ref: "{{KIT_REF}}"
          path: .kit
      - name: Check the records
        run: |
          command -v python3 >/dev/null 2>&1 || { echo 'Check the records needs Python 3, which this runner does not have. Add a step that installs Python 3 before this one.'; exit 2; }
          kit="${CLAUDE_PLUGIN_ROOT:-.kit/kit}"
          python3 "$kit/scripts/records-check.py"
      - name: Install and test
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCAFFOLD_TEST_COMMAND: {{SCAFFOLD_TEST_COMMAND}}
        run: |
          command -v python3 >/dev/null 2>&1 || { echo 'Install and test needs Python 3, which this runner does not have. Add a step that installs Python 3 before this one.'; exit 2; }
          kit="${CLAUDE_PLUGIN_ROOT:-.kit/kit}"
          python3 "$kit/scripts/hosted-check.py" --base "${PR_BASE_SHA:-}" --scaffold-command "${SCAFFOLD_TEST_COMMAND:-}"
